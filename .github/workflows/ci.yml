name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 构建
        run: |
          bin/igv-l10n deps
          bin/igv-l10n build

      - name: 词表校验
        run: bin/igv-l10n check

      - name: 自检（假 igv.jar：audit -> dryrun -> 断言）
        run: tests/run.sh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: igv-l10n-agent
          path: build/agent.jar
